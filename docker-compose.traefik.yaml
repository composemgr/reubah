
name: reubah
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: ghcr.io/dendianugerah/reubah:latest
    container_name: reubah-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: reubah-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      # Reubah listens on this container port
      PORT: '8081'
    volumes:
      - './volumes/data/tmp:/tmp:rw'
      - './volumes/data/reubah:/app/tmp:rw'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8081 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.reubah-app.entrypoints=http'
      - 'traefik.http.routers.reubah-app.rule=Host(${BASE_HOST_NAME:-$HOSTNAME})'
      - 'traefik.http.routers.reubah-app.middlewares=reubah-app-https-redirect'
      - 'traefik.http.middlewares.reubah-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.reubah-app-secure.entrypoints=https'
      - 'traefik.http.routers.reubah-app-secure.rule=Host(${BASE_HOST_NAME:-$HOSTNAME})'
      - 'traefik.http.routers.reubah-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.reubah-app-secure.service=reubah-app'
      - 'traefik.http.services.reubah-app.loadbalancer.server.port=8081'
    networks:
      - reubah
      - traefik

networks:
  reubah:
    name: reubah
    external: false
  traefik:
    external: true
