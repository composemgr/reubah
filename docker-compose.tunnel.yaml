
name: reubah
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: ghcr.io/dendianugerah/reubah:latest
    container_name: reubah-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: reubah-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      # Reubah listens on this container port
      PORT: '8081'
    volumes:
      - './volumes/data/tmp:/tmp:rw'
      - './volumes/data/reubah:/app/tmp:rw'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8081 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://reubah-app:8081'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - reubah
      - cloudflare

networks:
  reubah:
    name: reubah
    external: false
  cloudflare:
    external: true
